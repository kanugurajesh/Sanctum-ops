services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hms_owner
      POSTGRES_PASSWORD: hms_owner_pw
      POSTGRES_DB: hms
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_owner -d hms"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Owner connection: migrations + seed only. The API itself serves requests on the
      # restricted, RLS-bound hms_app role.
      OWNER_DATABASE_URL: postgresql+psycopg://hms_owner:hms_owner_pw@db:5432/hms
      APP_DATABASE_URL: postgresql+psycopg://hms_app:hms_app_pw@db:5432/hms
      APP_DB_PASSWORD: hms_app_pw
      DEMO_MODE: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "python -m app.db.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
